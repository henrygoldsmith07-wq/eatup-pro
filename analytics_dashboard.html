<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatUp Pro - Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    
    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-brand-600">EatUp Pro Analytics</h1>
                </div>
                <button onclick="refreshData()" class="inline-flex items-center px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Refresh Data
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Key Metrics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 fade-in">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Total Used</p>
                        <p class="text-2xl font-bold text-gray-900 dark:text-white" id="totalUsed">-- GB</p>
                    </div>
                    <div class="p-3 bg-blue-100 dark:bg-blue-900 rounded-full">
                        <svg class="w-6 h-6 text-blue-600 dark:text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    </div>
                </div>
            </div>
            
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Space Freed</p>
                        <p class="text-2xl font-bold text-gray-900 dark:text-white" id="spaceFreed">-- MB</p>
                    </div>
                    <div class="p-3 bg-green-100 dark:bg-green-900 rounded-full">
                        <svg class="w-6 h-6 text-green-600 dark:text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    </div>
                </div>
            </div>
            
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border-l-4 border-purple-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Files Analyzed</p>
                        <p class="text-2xl font-bold text-gray-900 dark:text-white" id="filesAnalyzed">--</p>
                    </div>
                    <div class="p-3 bg-purple-100 dark:bg-purple-900 rounded-full">
                        <svg class="w-6 h-6 text-purple-600 dark:text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                    </div>
                </div>
            </div>
            
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border-l-4 border-orange-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Growth Rate</p>
                        <p class="text-2xl font-bold text-gray-900 dark:text-white" id="growthRate">-- MB/day</p>
                    </div>
                    <div class="p-3 bg-orange-100 dark:bg-orange-900 rounded-full">
                        <svg class="w-6 h-6 text-orange-600 dark:text-orange-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Usage Trend Chart -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-semibold mb-4">Storage Usage Trend (90 Days)</h3>
                <canvas id="usageTrendChart"></canvas>
            </div>
            
            <!-- Category Distribution Pie -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-semibold mb-4">Category Distribution</h3>
                <canvas id="categoryPieChart"></canvas>
            </div>
        </div>

        <!-- Cleanup History -->
        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm">
            <h3 class="text-lg font-semibold mb-4">Recent Cleanup Activities</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="bg-gray-50 dark:bg-gray-700">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date/Time</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Files Cleaned</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Space Freed</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody id="cleanupTableBody" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Predictions & Insights -->
        <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Drive Full Prediction -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-semibold mb-4">Drive Full Prediction</h3>
                <div id="predictionCard">
                    <div class="text-center py-8">
                        <svg class="w-16 h-16 mx-auto text-yellow-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                        <p class="text-gray-600 dark:text-gray-400">Calculating...</p>
                    </div>
                </div>
            </div>
            
            <!-- Smart Recommendations -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-semibold mb-4">AI Recommendations</h3>
                <ul id="recommendationsList" class="space-y-3">
                    <!-- Populated by JavaScript -->
                </ul>
            </div>
        </div>

    </main>

    <script>
        // API Configuration
        const API_BASE = 'http://localhost:5000/api/v1';
        
        let usageChart, pieChart;

        async function fetchData() {
            try {
                // Get usage stats
                const statsResponse = await fetch(`${API_URL}/usage/stats`);
                const stats = await statsResponse.json();
                
                // Update metrics
                document.getElementById('totalUsed').textContent = (stats.used_gb || 0).toFixed(1) + ' GB';
                document.getElementById('growthRate').textContent = '10.5 MB/day'; // Placeholder
                
                // Generate mock data for charts
                generateMockChartData();
                
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function generateMockChartData() {
            // Usage trend chart
            const ctxUsage = document.getElementById('usageTrendChart').getContext('2d');
            const days = Array.from({length: 30}, (_, i) => i + 1);
            const usedValues = Array.from({length: 30}, () => Math.floor(Math.random() * 50) + 150);
            
            if (usageChart) usageChart.destroy();
            
            usageChart = new Chart(ctxUsage, {
                type: 'line',
                data: {
                    labels: days.map(d => `Day ${d}`),
                    datasets: [{
                        label: 'Used Space (GB)',
                        data: usedValues,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } }
                }
            });
            
            // Category pie chart
            const ctxPie = document.getElementById('categoryPieChart').getContext('2d');
            const categories = ['Apps', 'Videos', 'Docs', 'Images', 'Music', 'Other'];
            const values = [45, 24, 18, 8, 3, 2];
            
            if (pieChart) pieChart.destroy();
            
            pieChart = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: categories,
                    datasets: [{
                        data: values,
                        backgroundColor: ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#ef4444', '#6b7280']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { 
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.raw + '%';
                                }
                            }
                        }
                    }
                }
            });
            
            // Update cleanup table
            updateCleanupTable();
            
            // Generate recommendations
            generateRecommendations();
        }

        function updateCleanupTable() {
            const tbody = document.getElementById('cleanupTableBody');
            const recentCleans = [];
            
            // Mock data
            for (let i = 0; i < 5; i++) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                
                recentCleans.push({
                    date: date.toLocaleString(),
                    type: ['Smart', 'Temp Files', 'Duplicates'][Math.floor(Math.random() * 3)],
                    files: Math.floor(Math.random() * 200) + 10,
                    freed: (Math.random() * 500).toFixed(1),
                    status: 'completed'
                });
            }
            
            tbody.innerHTML = recentCleans.map(clean => `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-white">${clean.date}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-white">${clean.type}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${clean.files}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-green-600">${clean.freed} MB</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                            ${clean.status}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function generateRecommendations() {
            const recommendations = [
                { icon: '📁', text: 'Consider cleaning temp files (estimated 2.3 GB)', priority: 'medium' },
                { icon: '🔄', text: 'Found 89 duplicate files that can be removed', priority: 'high' },
                { icon: '💾', text: 'Review large files over 1GB for potential deletion', priority: 'low' },
                { icon: '☁️', text: 'Sync cloud storage to reduce local duplicates', priority: 'medium' }
            ];
            
            const list = document.getElementById('recommendationsList');
            list.innerHTML = recommendations.map(rec => `
                <li class="flex items-start space-x-3 p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    <span class="text-2xl">${rec.icon}</span>
                    <div class="flex-1">
                        <p class="text-sm text-gray-900 dark:text-white">${rec.text}</p>
                        <span class="text-xs text-gray-500 dark:text-gray-400 capitalize">${rec.priority} priority</span>
                    </div>
                </li>
            `).join('');
        }

        function refreshData() {
            fetchData();
        }

        // Initialize
        fetchData();
        
        // Auto-refresh every 60 seconds
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
